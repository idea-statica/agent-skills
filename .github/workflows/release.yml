name: release

# `claude plugin tag plugins/<plugin> --push` creates and pushes a <plugin>--v<version> tag.
on:
  push:
    tags: ["*--v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml==6.0.3

      - name: Repository checks
        run: python scripts/check_repo.py

      - name: Build release files
        run: python scripts/build_release.py "$GITHUB_REF_NAME" --out dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            --verify-tag
